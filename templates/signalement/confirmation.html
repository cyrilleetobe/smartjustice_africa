<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartJustice — Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6fb; font-family:Arial,sans-serif; }
        .card-confirmation { background:white; border-radius:12px; padding:40px; box-shadow:0 2px 12px rgba(0,0,0,0.08); text-align:center; }
        .code-box { background:#1a1a2e; color:#4fc3f7; font-size:1.8rem; font-weight:bold; letter-spacing:4px; padding:16px 32px; border-radius:8px; display:inline-block; margin:16px 0; font-family:monospace; }
        .badge-statut { background:#e8f5e9; color:#2e7d32; padding:6px 16px; border-radius:20px; font-size:0.85rem; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-confirmation">
                <div style="font-size:3rem;">&#10003;</div>
                <h3 style="color:#1a1a2e;">Signalement enregistre</h3>
                <p class="text-muted">Conservez ce code pour suivre votre signalement.</p>
                <div class="code-box">{{ code }}</div>
                <div class="mt-3">
                    <span class="badge-statut">{{ statut }}</span>
                </div>
                <hr class="my-4">
                <div class="row text-start">
                    <div class="col-6">
                        <small class="text-muted">Type</small>
                        <div class="fw-semibold">{{ type }}</div>
                    </div>
                    <div class="col-6">
                        <small class="text-muted">Date de soumission</small>
                        <div class="fw-semibold">{{ date|date:"d/m/Y H:i" }}</div>
                    </div>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <a href="/signalement/suivi/" class="btn btn-outline-secondary">Suivre mon signalement</a>
                    <a href="/signalement/" class="btn" style="background:#1a1a2e;color:white;">Nouveau signalement</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
