<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartJustice — Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6fb; font-family:Arial,sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:white; border-radius:16px; padding:40px; box-shadow:0 4px 24px rgba(0,0,0,0.10); width:100%; max-width:420px; }
        .login-logo { text-align:center; margin-bottom:28px; }
        .login-logo h2 { color:#1a1a2e; font-size:1.4rem; margin:8px 0 4px; }
        .login-logo small { color:#888; font-size:0.85rem; }
        .form-control { border-radius:8px; padding:10px 14px; border:1px solid #ddd; }
        .form-control:focus { border-color:#1a1a2e; box-shadow:0 0 0 3px rgba(26,26,46,0.08); }
        .btn-login { background:#1a1a2e; color:white; border:none; padding:12px; border-radius:8px; width:100%; font-size:1rem; margin-top:8px; }
        .btn-login:hover { background:#2d2d4e; color:white; }
        .securite-note { background:#e8f5e9; border-radius:8px; padding:10px 14px; font-size:0.8rem; color:#2e7d32; margin-top:20px; text-align:center; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <div style="font-size:2.5rem;">&#9878;</div>
        <h2>SmartJustice Africa</h2>
        <small>Aide a la decision judiciaire · Cameroun</small>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger" style="font-size:0.85rem;">
        Identifiants incorrects. Veuillez reessayer.
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:0.9rem;">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" placeholder="Votre identifiant" autofocus required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:0.9rem;">Mot de passe</label>
            <input type="password" name="password" class="form-control" placeholder="Votre mot de passe" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-login btn">Se connecter</button>
    </form>
    <div class="securite-note">
        Connexion securisee · Audit trail actif · AES-256
    </div>
</div>
</body>
</html>
